[globals]
PHONE_AGENT_AGI=/opt/phone-agent/agi-bin/phone-agent-agi

[from-fritzbox]
exten => s,1,NoOp(Inbound call for Nik phone agent)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=de)
 same => n,AGI(${PHONE_AGENT_AGI})
 same => n,Hangup()

[internal]
exten => 700,1,NoOp(Local phone-agent test)
 same => n,Goto(from-fritzbox,s,1)

[outbound-fritzbox]
exten => _X.,1,NoOp(Outbound test via FRITZBox to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@fritzbox-endpoint,20)
 same => n,Hangup()

exten => _**X.,1,NoOp(Internal FRITZBox test via ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@fritzbox-endpoint,20)
 same => n,Hangup()
