{% extends "base.html" %}
{% block content %}
<header class="page-header">
  <div class="page-title">
    <h2>Settings</h2>
    <p>Maskierte Konfiguration für STT, TTS, SIP, Cloudflare, Mail und Automationen.</p>
  </div>
  <span class="pill">Read only</span>
</header>
<section class="metric-grid">
{% for key,value in settings.items() %}
  <div class="tile wide"><span>{{ key }}</span><strong>{{ value }}</strong></div>
{% endfor %}
</section>
{% endblock %}
